server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend allows uploads up to 25MB (see backend/src/routes/submissions.ts); nginx
    # defaults to 1MB and silently 413s anything larger before it reaches the backend.
    client_max_body_size 30m;

    # The app is built with VITE_BASE_URL=/smarthorizon/portal/, so every asset/API
    # reference in the built HTML/JS already carries that prefix. Some outer reverse
    # proxies strip the prefix before forwarding here, others pass it through as-is -
    # these blocks handle the "passed through as-is" case; the unprefixed blocks below
    # handle the "already stripped" case. Having both means this works either way.

    location /smarthorizon/portal/api/notifications/feed {
        proxy_pass http://backend:5000/api/notifications/feed;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    location /smarthorizon/portal/api/uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    location /smarthorizon/portal/api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /smarthorizon/portal/uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    # Static assets and SPA routes requested with the prefix still attached
    # (e.g. /smarthorizon/portal/assets/logo_final.png) - strip it via alias so the
    # lookup lands on the actual (always-flat) dist/ file layout.
    location /smarthorizon/portal/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /smarthorizon/portal/index.html;
    }

    # Server-Sent Events feed needs buffering disabled and a long-lived connection.
    location /api/notifications/feed {
        proxy_pass http://backend:5000/api/notifications/feed;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    # frontend/src/features/dashboard/components/TeamDetailDrawer.tsx prefixes uploaded
    # PDF links with VITE_API_URL (=/api), so /api/uploads/* must also reach the backend's
    # plain /uploads/* static route.
    location /api/uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # frontend/src/features/reviews/pages/TeamReviews.tsx links to team.pdfUrl unprefixed.
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
